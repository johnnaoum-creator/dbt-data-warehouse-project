version: 2

models:
  - name: DIMGender
    description: "Dimension Gender" # Documentation for the model
    columns:
      - name: gender_id
        description: "Primary Key for Gender"
        tests:
          - unique
          - not_null
      - name: gender
        description: "Gender"
        tests:
          - not_null
          - accepted_values:
              values: ["Male","Female"]

  - name: DIMDate
    description: "Dimension Date"
    columns:
      - name: date_key
        description: "Primary Key for Date"
        tests:
          - unique
          - not_null
      - name: date
        description: "Date"
        tests:
          - not_null
      - name: year
        description: "Year"
        tests:
          - not_null
      - name: month
        description: "Month"
        tests:
          - not_null
      - name: day
        description: "Day"
        tests:
          - not_null
      - name: month_name
        description: "Month Name"
        tests:
          - not_null
      - name: day_name
        description: "Day Name"
        tests:
          - not_null

  - name: DIMEmployee
    description: "Dimension Employees"
    columns:
      - name: employee_id
        description: "Primary Key for Employee"
        tests:
          - unique
          - not_null
      - name: full_name
        description: "Full Name"
        tests:
          - not_null
      - name: first_name
        description: "First Name"
        tests:
          - not_null
      - name: last_name
        description: "Last Name"
        tests:
          - not_null
      - name: email
        description: "Email"
        tests:
          - not_null

  - name: OBT
    description: "ODS Table"
    columns:
      - name: employee_id
        description: "Primary Key for OBT"
        tests:
          - unique
          - not_null
      - name: first_name
        description: "First Name"
        tests:
          - not_null
      - name: last_name
        description: "Last Name"
        tests:
          - not_null
      - name: email
        description: "Email"
        tests:
          - not_null
      - name: gender
        description: "Gender"
        tests:
          - not_null
      - name: date
        description: "Date of Birth"
        tests:
          - not_null
      - name: salary
        description: "Salary"
        tests:
          - not_null
      - name: department
        description: "Department"
        tests:
          - not_null
      - name: country
        description: "Country"
        tests:
          - not_null

  - name: DIMCountry
    description: "Dimension Country"
    columns:
      - name: country_id
        description: "Primary Key for Country"
        tests:
          - unique
          - not_null
      - name: country
        description: "Country"
        tests:
          - not_null

  - name: DIMDepartment
    description: "Dimension Department"
    columns:
      - name: department_id
        description: "Primary Key for Department"
        tests:
          - unique
          - not_null
      - name: department
        description: "Department"
        tests:
          - not_null